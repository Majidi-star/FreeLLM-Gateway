appId: com.freellm.goalroute
productName: GoalRoute
copyright: "Copyright © 2026 FreeLLM-Gateway"
npmRebuild: false

directories:
  output: dist-electron
  buildResources: build

files:
  - "dist/**/*"
  - "dist-web/**/*"
  - "electron/dist/**/*"
  - "package.json"

extraMetadata:
  main: electron/dist/main.js

publish:
  provider: github
  owner: Majidi-star
  repo: FreeLLM-Gateway
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GoalRoute

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
    - target: zip
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
