name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Verify Version & Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Version Consistency
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION, package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Git tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)!"
            exit 1
          fi

      - name: Run Test Suite
        run: npm test

  release:
    name: Build & Upload Assets (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libfuse2t64 desktop-file-utils fakeroot xvfb || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build:electron

      - name: Package Release Artifacts
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run --auto-servernum -- npx electron-builder --linux --config electron-builder.yml --publish never
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            npx electron-builder --mac --config electron-builder.yml --publish never
          else
            npx electron-builder --win --config electron-builder.yml --publish never
          fi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.tar.gz
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
